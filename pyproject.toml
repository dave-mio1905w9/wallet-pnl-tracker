[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-pnl"
version = "0.1.0"
description = "Track in-game trade logs and compute FIFO/avg cost basis PnL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
]

[project.scripts]
wallet-pnl = "wallet_pnl.cli:main"
